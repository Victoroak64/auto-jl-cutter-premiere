name: Release

# Cria a release automaticamente ao empurrar uma tag v*
# Ex.: git tag v3.0.1 && git push origin v3.0.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build package
        run: ./scripts/build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
