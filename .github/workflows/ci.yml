name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # build.sh já roda todas as validações: sintaxe JS, ES3 no
      # ExtendScript, manifest válido, arquivos obrigatórios presentes
      - run: ./scripts/build.sh
